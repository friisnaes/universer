<script type="application/ld+json">{"@context": "https://schema.org", "@type": "CollectionPage", "name": "Friisnæs Universer", "url": "https://friisnaes.github.io/universer/", "inLanguage": "da", "description": "12 universer af Thomas Friisnæs om topledelse, strategi, karakter og arbejdsliv – med indhold, modeller og forbindelserne imellem dem.", "author": {"@type": "Person", "name": "Thomas Friisnæs", "url": "https://www.friisnaes.com/"}, "dateModified": "2026-10-16", "mainEntity": {"@type": "ItemList", "itemListElement": [{"@type": "ListItem", "position": 1, "item": {"@type": "CreativeWork", "name": "Executive Coaching 2027", "alternativeHeadline": "Din egen fremtidssikring og bæredygtighed som executive", "description": "Executive sustainability: hvordan du som topleder bliver ved med at være værdifuld, skarp og menneskelig – tre måneder, tre kvartaler og tre år frem. Bogen viser, hvor executive-rollen forandrer sig, hvorfor dømmekraft ikke kan outsources, og hvordan du bygger din egen personlige governance.", "url": "https://www.friisnaes.com/library.html", "author": {"@type": "Person", "name": "Thomas Friisnæs"}}}, {"@type": "ListItem", "position": 2, "item": {"@type": "CreativeWork", "name": "En anatomi af topledelse", "alternativeHeadline": "Ti kapitler om det, der faktisk sker i toppen – når presset er reelt, og ingen siger det højt", "description": "Et nøgternt blik på mekanismerne i toppen af en organisation: selvbedrag, karakter under pres, den tavse direktion og det modspil, der mangler. Bogen giver topledere et sprog for det, der sjældent bliver sagt højt, og konkrete greb til at handle på det.", "url": "https://www.friisnaes.com/boeger.html", "author": {"@type": "Person", "name": "Thomas Friisnæs"}}}, {"@type": "ListItem", "position": 3, "item": {"@type": "CreativeWork", "name": "Strategien sker mellem kvartalerne", "alternativeHeadline": "Strategisk observabilitet – det, direktionen kunne have set tidligere", "description": "Strategi realiseres ikke i kvartalsrapporten, men i ugerne imellem. Serien viser, hvordan en direktion kan se tidlige signaler om kapacitet, friktion og beslutningshastighed – uden at forveksle måling med styring. Kategori først, produkt sidst.", "url": "https://www.friisnaes.com/strategien-sker-mellem-kvartalerne-serie.html", "author": {"@type": "Person", "name": "Thomas Friisnæs"}}}, {"@type": "ListItem", "position": 4, "item": {"@type": "CreativeWork", "name": "Executive Longevity", "alternativeHeadline": "Ti kapitler om at forblive kognitivt skarp – og forvalte den kapacitet, der bærer en lang lederkarriere", "description": "Kan du stadig præstere på højt niveau om ti-femten år? Ikke biohacking, men forvaltning af lederens egen kapacitet: krop, kognition, belastning og mening – målt med Executive Longevity Index.", "url": "https://www.friisnaes.com/library.html", "author": {"@type": "Person", "name": "Thomas Friisnæs"}}}, {"@type": "ListItem", "position": 5, "item": {"@type": "CreativeWork", "name": "A-holdet", "alternativeHeadline": "Ti kapitler om at samle, udvikle og fastholde det ledelseshold, strategien kræver", "description": "Strategien bestemmer holdet – og strategien flytter sig, så holdet bliver aldrig færdigt. Universet handler om at sammensætte, lede og forny et ledelseshold ud fra det, strategien kræver, med karakter, samspil og ærlig uenighed som omdrejningspunkter.", "url": "https://www.friisnaes.com/holdet-bag-strategien.html", "author": {"@type": "Person", "name": "Thomas Friisnæs"}}}, {"@type": "ListItem", "position": 6, "item": {"@type": "CreativeWork", "name": "Strategi. Eksekveret!", "alternativeHeadline": "Maksimalt output. Minimal indsats. Ti ledelsesudfordringer – og én model for at få det gjort", "description": "Hvorfor gode strategier ikke bliver til resultater: prioriteringsparalyse, den bookede kalender, kontekstskift, mødekultur og de udskudte samtaler. Ti udfordringer samlet i én model for at få det gjort.", "url": "https://www.friisnaes.com/library.html", "author": {"@type": "Person", "name": "Thomas Friisnæs"}}}, {"@type": "ListItem", "position": 7, "item": {"@type": "CreativeWork", "name": "Struktur sætter fri", "alternativeHeadline": "Den effektive arbejdsdag – fra kalenderanarki til designet tid", "description": "Arbejdsdagen er sjældent designet – den bliver booket. Universet viser, hvordan en organisation designer tiden med fælles rytmer: morgenens tydelighed, beskyttet fokus, reverse scheduling og en dag, der bliver lukket. Gevinsten er tid tilbage – og måske en fire-dages uge som resultat, ikke som rabat.", "url": "https://www.friisnaes.com/struktur-saetter-fri.html", "author": {"@type": "Person", "name": "Thomas Friisnæs"}}}, {"@type": "ListItem", "position": 8, "item": {"@type": "CreativeWork", "name": "Du ansætter på CV – men du leder på karakter", "alternativeHeadline": "Mennesker, du kan bygge på", "description": "Når faglighed tages for givet og i stigende grad leveres af AI, er det karakteren, der gør forskellen. Bogen handler ikke om rekruttering, men om de syv karakteregenskaber, du leder på – og hvordan du ser, udvikler og beskytter dem.", "url": "https://www.friisnaes.com/boeger.html", "author": {"@type": "Person", "name": "Thomas Friisnæs"}}}, {"@type": "ListItem", "position": 9, "item": {"@type": "CreativeWork", "name": "Den svære samtale", "alternativeHeadline": "En praktisk guide til ledere, der tør se mennesket i øjnene", "description": "De nødvendige samtaler, der bliver udskudt, pakket ind eller aldrig lukket. Bogen giver en disciplin for at forberede, tage og afslutte den svære samtale – og begrebet samtalegæld for det, det koster at lade være.", "url": "https://www.friisnaes.com/boeger.html", "author": {"@type": "Person", "name": "Thomas Friisnæs"}}}, {"@type": "ListItem", "position": 10, "item": {"@type": "CreativeWork", "name": "Kom. Til. Tiden.", "alternativeHeadline": "Ledelse starter med respekt for den eneste ressource, du aldrig får igen", "description": "Punktlighed som respekt og som ledelsessignal. Bogen voksede ud af et LinkedIn-opslag med mere end en halv million visninger og viser, hvordan forholdet til tid afslører karakter – og hvordan man ændrer det i morgen.", "url": "https://www.friisnaes.com/boeger.html", "author": {"@type": "Person", "name": "Thomas Friisnæs"}}}, {"@type": "ListItem", "position": 11, "item": {"@type": "CreativeWork", "name": "Det vigtigste, du ikke kan købe til dit barn", "alternativeHeadline": "Ti mentale muskler, fire aldre og tre generationer – et træningsprogram i karakter", "description": "Karakter kan ikke købes, men den kan trænes. Bogen giver forældre og bedsteforældre et træningsprogram i ti mentale muskler, tilpasset fire aldre og tre generationer – med samtalekort til hele familien.", "url": "https://www.friisnaes.com/boeger.html", "author": {"@type": "Person", "name": "Thomas Friisnæs"}}}, {"@type": "ListItem", "position": 12, "item": {"@type": "CreativeWork", "name": "Digte101", "alternativeHeadline": "Δ+ · Σ= · Ω0 – en trilogi i 101 digte", "description": "Digte om ansvar frem for smerte. En trilogi på 101 digte bygget som en matematisk-poetisk konstruktion – Delta Plus, Sigma Equal og den kommende Omega Zero om slutningen på noget og begyndelsen på det næste.", "url": "https://www.friisnaes.com/boeger.html", "author": {"@type": "Person", "name": "Thomas Friisnæs"}}}]}}</script>

<style>
:root{
  --ink:#111111; --red:#c0392b; --red2:#e74c3c; --paper:#f6f1e8; --card:#fffdf9;
  --line:#e2d9cb; --mute:#6b655d; --soft:#efe7da;
  --serif:'Playfair Display',Georgia,serif; --sans:'Outfit',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:24px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--red)}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
/* hero */
.hero{background:var(--ink);color:#f6f1e8;padding:56px 0 44px;border-bottom:4px solid var(--red)}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--red2);font-weight:600}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,5.4vw,60px);line-height:1.05;margin:12px 0 14px}
.hero p.lead{max-width:720px;color:#d8d0c3;font-size:clamp(17px,1.6vw,19px);margin:0}
.motto{margin-top:22px;font-family:var(--serif);font-style:italic;color:#bfb6a8}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px}
.stat b{display:block;font-family:var(--serif);font-size:34px;line-height:1;color:#fff}
.stat span{font-size:13px;color:#a9a091;letter-spacing:.04em}
.topnav{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:30px}
.topnav a{color:#d8d0c3;text-decoration:none}.topnav a:hover{color:#fff}
.brand{font-family:var(--serif);font-weight:700;color:#fff!important;font-size:18px}
/* layout */
.explore{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;padding:40px 0 20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px}
.mapbox{padding:16px 16px 8px;position:sticky;top:16px}
.maphead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 6px 8px}
.maphead h2{font-family:var(--serif);font-size:22px;margin:0}
.hint{font-size:13px;color:var(--mute)}
svg.map{width:100%;height:auto;display:block;touch-action:manipulation}
.edge{fill:none;stroke:#cfc4b3;stroke-width:1.3;transition:stroke .2s,opacity .2s,stroke-width .2s}
.edge.on{stroke:var(--red);stroke-width:2.4;opacity:1}
.map.focus .edge:not(.on){opacity:.14}
.node{cursor:pointer;outline:none}
.node circle.dot{stroke:#fffdf9;stroke-width:3;transition:r .2s}
.node circle.halo{fill:none;stroke:var(--red);stroke-width:2.5;opacity:0;transition:opacity .2s}
.node.sel circle.halo,.node:focus-visible circle.halo{opacity:1}
.node text.n{fill:#fff;font:600 17px var(--sans);pointer-events:none}
.node text.lbl{fill:var(--ink);font:500 21px var(--sans);pointer-events:none}
.key{display:none;list-style:none;margin:0;padding:4px 6px 8px;columns:2;column-gap:12px}
.key li{break-inside:avoid}
.key button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px;line-height:1.25;min-height:40px}
.key button b{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;display:grid;place-items:center}
.key button[aria-current="true"]{color:var(--red);font-weight:600}
.map.focus .node:not(.near) {opacity:.35}
.node.wip circle.dot{stroke-dasharray:4 3;stroke:#9a9286}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 8px 10px;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px dashed #9a9286;background:transparent}
/* detail */
.detail{overflow:hidden}
.band{padding:26px 28px 22px;color:#fff;position:relative}
.band .num{font-family:var(--serif);font-size:15px;opacity:.75}
.band h2{font-family:var(--serif);font-size:clamp(26px,2.6vw,34px);line-height:1.12;margin:6px 0 8px}
.band .sub{color:rgba(255,255,255,.82);font-size:16px;margin:0}
.band .serie{margin-top:14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--red)}
.dbody{padding:22px 28px 28px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.badge{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.badge.final{background:var(--ink);color:#fff}
.badge.wip{background:#fff;border:1px dashed var(--mute);color:var(--mute)}
.kerne{font-size:18px;line-height:1.6;margin:0 0 18px}
.meta{font-size:14.5px;color:var(--mute);margin:0 0 18px}
.meta b{color:var(--ink);font-weight:600}
h3{font-family:var(--serif);font-size:18px;margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
ol.toc{margin:0;padding-left:22px;font-size:15.5px}
ol.toc li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13.5px;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:#fff}
ul.rel{list-style:none;margin:0;padding:0}
ul.rel li{padding:10px 0;border-bottom:1px solid var(--line)}
ul.rel li:last-child{border-bottom:0}
ul.rel button{all:unset;cursor:pointer;font-weight:600;color:var(--red);font-size:15.5px;display:inline-flex;align-items:center;gap:8px;min-height:32px}
ul.rel button:hover,ul.rel button:focus-visible{text-decoration:underline}
ul.rel button i{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
ul.rel p{margin:2px 0 0;font-size:15px;color:#3b3732}
.intern{margin-top:22px;background:#fbf3e4;border-left:4px solid var(--red);padding:14px 16px;font-size:15px}
.intern b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.more{display:inline-block;margin-top:20px;font-weight:600;text-decoration:none;border-bottom:2px solid var(--red);padding-bottom:2px}
/* list */
.listhead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin:36px 0 16px}
.listhead h2{font-family:var(--serif);font-size:30px;margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:500 14px var(--sans);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:40px}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding-bottom:56px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 8px 24px rgba(17,17,17,.10)}
.card:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.spine{height:10px}
.card .cb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .cn{font-family:var(--serif);font-size:13px;color:var(--mute)}
.card .ct{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.2}
.card .cs{font-size:14.5px;color:var(--mute)}
.card .cf{margin-top:auto;padding-top:8px;font-size:12.5px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.card.wip{border-style:dashed}
footer{background:var(--ink);color:#a9a091;font-size:14px;padding:30px 0}
footer a{color:#e8e0d3}
.printlist{display:none}
@media (max-width:900px){
  .explore{grid-template-columns:1fr}
  .mapbox{position:static}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .hero{padding:36px 0 32px}
  .band,.dbody{padding-left:18px;padding-right:18px}
  .node text.lbl{display:none}
  .node text.n{font-size:25px}
  .key{display:block}
  .mapbox{padding:12px 10px 6px}
  .maphead h2{font-size:20px}
}
@media (pointer:coarse){ .filters button{min-height:44px} }
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  body{background:#fff;font-size:11pt}
  .hero{padding:0 0 14px;background:#fff;color:#111;border-bottom:3px solid var(--red)}
  .hero h1{color:#111;font-size:30pt}.hero p.lead,.motto{color:#333}.stat b{color:#111}.stat span{color:#555}
  .topnav,.explore,.listhead,.grid,footer{display:none}
  .printlist{display:block}
  .pu{break-inside:avoid-page;page-break-inside:avoid;border:1px solid #ddd;border-left:10px solid var(--c);padding:10px 14px;margin:0 0 10px;border-radius:4px}
  .pu h2{font-family:var(--serif);font-size:15pt;margin:0 0 2px}
  .pu .ps{font-size:10pt;color:#555;margin:0 0 6px}
  .pu p{margin:4px 0;font-size:10pt}
  .pu .pr{font-size:9.5pt;color:#333}
  .pmap{break-after:page;text-align:center}
  .pmap svg{width:150mm;height:auto}
}
</style>

  U.forEach(function(u){
    var p=pos[u.id];
    var g = el('g',{class:'node'+(isFinal(u)?'':' wip'),tabindex:'0',role:'button','aria-label':u.nr+'. '+u.titel},gN);
    el('circle',{class:'halo',cx:p.x,cy:p.y,r:29},g);
    el('circle',{class:'dot',cx:p.x,cy:p.y,r:22,fill:u.farve.hex},g);
    var t=el('text',{class:'n',x:p.x,y:p.y,'text-anchor':'middle','dominant-baseline':'central'},g); t.textContent=u.nr;
    var lx=p.x+Math.cos(p.a)*36, ly=p.y+Math.sin(p.a)*36+7;
    var anchor = Math.abs(Math.cos(p.a))<0.1 ? 'middle' : (Math.cos(p.a)>0?'start':'end');
    if(Math.abs(Math.cos(p.a))<0.1) ly += Math.sin(p.a)>0 ? 14 : -6;
    var short = u.kort || shortTitle(u.titel);
    var L=el('text',{class:'lbl',x:lx,y:ly,'text-anchor':anchor},g); L.textContent=short;
    g.addEventListener('click',function(){select(u.id,true)});
    g.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(u.id,true)}});
    g.addEventListener('mouseenter',function(){hover(u.id)});
    g.addEventListener('mouseleave',function(){hover(null)});
    nodes[u.id]=g;
  });
  function shortTitle(t){
    var s=t.split(/ – | — |, du /)[0].replace(/\?$/,'?');
    return s.length>26 ? s.slice(0,24)+'…' : s;
  }
  var mq=window.matchMedia('(max-width:560px)');
  function layout(){
    var small=mq.matches;
    svg.setAttribute('viewBox', small ? '52 52 536 536' : '-170 0 980 640');
    svg.querySelectorAll('circle.dot').forEach(function(c){c.setAttribute('r', small?30:22)});
    svg.querySelectorAll('circle.halo').forEach(function(c){c.setAttribute('r', small?38:29)});
  }
  layout(); if(mq.addEventListener) mq.addEventListener('change',layout);
  var key=document.getElementById('key');
  key.innerHTML=U.map(function(u){return '<li><button type="button" data-go="'+u.id+'"><b style="background:'+esc(u.farve.hex)+'">'+u.nr+'</b>'+esc(u.kort||u.titel)+'</button></li>'}).join('');
  key.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){select(b.getAttribute('data-go'),true)})});
  var selected=null;
  function paint(id){
    svg.classList.toggle('focus',!!id);
    var near={}; if(id){near[id]=1; rels(id).forEach(function(x){near[x.u.id]=1})}
    edges.forEach(function(e){var on=id&&(e.__r.a===id||e.__r.b===id); e.classList.toggle('on',!!on); if(on) gE.appendChild(e)});
    U.forEach(function(u){nodes[u.id].classList.toggle('near',!!near[u.id]); nodes[u.id].classList.toggle('sel',u.id===selected)});
    key.querySelectorAll('[data-go]').forEach(function(b){b.setAttribute('aria-current', b.getAttribute('data-go')===selected)});
  }
  function hover(id){ paint(id||selected) }

  /* ---------- detail ---------- */
  var detail=document.getElementById('detail');
  function list(arr){return '<ol class="toc">'+arr.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>'}
  function chips(arr){return '<div class="chips">'+arr.map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join('')+'</div>'}
  function render(u){
    var rs=rels(u.id);
    var h='<div class="band" style="background:'+esc(u.farve.hex)+'"><div class="num">Univers '+String(u.nr).padStart(2,'0')+'</div><h2>'+esc(u.titel)+'</h2><p class="sub">'+esc(u.undertitel)+'</p><div class="serie">'+esc(u.serie)+'</div></div>';
    h+='<div class="dbody"><div class="badges">';
    h+= isFinal(u) ? '<span class="badge final">Final</span>' : '<span class="badge wip">I produktion</span>';
    h+='<span class="badge">'+esc(sporName[u.spor]||'')+'</span><span class="badge">'+esc(u.kanal)+'</span></div>';
    h+='<p class="kerne">'+esc(u.kerne)+'</p>';
    h+='<p class="meta"><b>Til:</b> '+esc(u.maalgruppe)+(u.statusnote?'<br><b>Status:</b> '+esc(u.statusnote):'')+'</p>';
    if(u.indhold&&u.indhold.length) h+='<h3>Indhold</h3>'+list(u.indhold);
    if(u.modeller&&u.modeller.length) h+='<h3>Modeller og greb</h3>'+chips(u.modeller);
    if(u.formater&&u.formater.length) h+='<h3>Formater</h3>'+chips(u.formater);
    if(rs.length){
      h+='<h3>Forbindelser til andre universer</h3><ul class="rel">';
      rs.forEach(function(x){h+='<li><button type="button" data-go="'+esc(x.u.id)+'"><i style="background:'+esc(x.u.farve.hex)+'"></i>'+esc(x.u.titel)+'</button><p>'+esc(x.tekst)+'</p></li>'});
      h+='</ul>';
    }
    if(u.intern) h+='<div class="intern"><b>Forretningsrolle</b>'+esc(u.intern.forretningsrolle)+'<br><br><b>Prioritering</b>'+esc(u.intern.prioritet)+(u.mappe?'<br><br><b>Mappe</b>'+esc(u.mappe):'')+'</div>';
    if(u.link && MODE!=='overblik') h+='<a class="more" href="'+esc(u.link)+'">Læs mere på '+esc(u.link.replace(/^https?:\/\/(www\.)?/,'').split('/')[0])+' →</a>';
    h+='</div>';
    detail.innerHTML=h;
    detail.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){select(b.getAttribute('data-go'),true)})});
  }
  function select(id,user){
    var u=byId[id]; if(!u) return;
    selected=id; render(u); paint(id);
    if(user){
      try{history.replaceState(null,'','#'+id)}catch(e){}
      if(window.innerWidth<=900) detail.scrollIntoView({behavior:'smooth',block:'start'});
    }
  }

  /* ---------- list + filters ---------- */
  var grid=document.getElementById('grid'), filt=document.getElementById('filters'), active='alle';
  var sp=[{id:'alle',navn:'Alle'}].concat(D.spor.filter(function(s){return U.some(function(u){return u.spor===s.id})}));
  filt.innerHTML=sp.map(function(s){return '<button type="button" data-f="'+s.id+'" aria-pressed="'+(s.id==='alle')+'">'+esc(s.navn)+'</button>'}).join('');
  filt.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;active=b.getAttribute('data-f');filt.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});drawGrid()});
  function drawGrid(){
    grid.innerHTML=U.filter(function(u){return active==='alle'||u.spor===active}).map(function(u){
      return '<button type="button" class="card'+(isFinal(u)?'':' wip')+'" data-go="'+u.id+'"><div class="spine" style="background:'+esc(u.farve.hex)+'"></div><div class="cb"><span class="cn">'+String(u.nr).padStart(2,'0')+' · '+esc(sporName[u.spor])+'</span><span class="ct">'+esc(u.titel)+'</span><span class="cs">'+esc(u.undertitel)+'</span><span class="cf"><span>'+rels(u.id).length+' forbindelser</span><span>'+(isFinal(u)?'Final':'I produktion')+'</span></span></div></button>';
    }).join('');
    grid.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){select(b.getAttribute('data-go'),true);document.querySelector('.explore').scrollIntoView({behavior:'smooth'})})});
  }
  drawGrid();

  /* legend */
  document.getElementById('legend').innerHTML = (U.some(function(u){return !isFinal(u)})?'<span><i></i>Stiplet = i produktion</span>':'')+'<span>Tallet er prioriteten – 1 er mest relevant for forretningen</span>';

  /* print version (all universes) */
  var pl=document.getElementById('printlist');
  var svgP=svg.cloneNode(true); svgP.setAttribute('viewBox','-170 0 980 640'); svgP.removeAttribute('id');
  pl.innerHTML='<div class="pmap">'+svgP.outerHTML+'</div>'+U.map(function(u){
    var rs=rels(u.id);
    return '<div class="pu" style="--c:'+esc(u.farve.hex)+'"><h2>'+String(u.nr).padStart(2,'0')+' · '+esc(u.titel)+(isFinal(u)?'':' <small>(i produktion)</small>')+'</h2><p class="ps">'+esc(u.undertitel)+' · '+esc(u.serie)+'</p><p>'+esc(u.kerne)+'</p>'
      +(u.intern?'<p><b>Forretningsrolle:</b> '+esc(u.intern.forretningsrolle)+'</p>':'')
      +'<p class="pr"><b>Forbindelser:</b> '+rs.map(function(x){return esc(x.u.titel)+' – '+esc(x.tekst)}).join(' · ')+'</p></div>';
  }).join('');

  var start=(location.hash||'').slice(1);
  select(byId[start]?start:U[0].id,false);
})();
</script>
</body>
</html>
